# Paths are relative to this file. No files or startup entries are installed.
[general]
mode = "transient"
logging = "warn"
deduplicate_ms = 1500

[resident]
tray_enabled = true
auto_start = false

[notifications]
enabled = true
position = "center"
monitor = "primary"
scale = 1.0
fade_in_ms = 150
fade_out_ms = 300
click_to_dismiss = true
interpolation = "nearest"

[sounds]
enabled = true
volume = 0.75
suppress_repeats = true

[events.turn_complete]
enabled = true
duration_ms = 3000

[events.permission_required]
enabled = true
duration_ms = 0

[events.input_required]
enabled = true
duration_ms = 0

[events.error]
enabled = true
duration_ms = 5000

[events.interrupted]
enabled = true
duration_ms = 3000

[codex]
hooks_enabled = true
input_monitoring = false

[usage]
enabled = false
refresh_interval_sec = 300
