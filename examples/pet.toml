# Point to a downloaded Codex pet.json. No installer command is executed.
# Relative paths resolve against this configuration directory.
[notifications]
scale = 1.0
interpolation = 'bilinear'

# Codex hooks and --demo use this artwork. Add one line per harness (claude, opencode, ...);
# `default` serves every harness without its own entry; `demo` is for --event.
[pets]
codex = '../characters/becky--natewanggg/pet.json'

# Override the automatically selected state for this agent's events.
# Entries directly under [pet_animations] are shared by every harness.
[pet_animations.codex]
turn_complete = 'jumping'
permission_required = 'review'
input_required = 'waiting'
error = 'failed'
interrupted = 'idle'

# Optional: retain the default sound settings or set your own WAV per event.
[sounds]
enabled = false

# Completion expires after three seconds; permission/input waits require a click.
[events.turn_complete]
duration_sec = 3
