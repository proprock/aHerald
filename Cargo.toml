[package]
name = "aherald"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Portable native notification companion for coding agents (Windows first)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aherald"
path = "src/main.rs"

[[example]]
name = "generate_assets"
path = "generate_assets.rs"

[features]
default = ["https-client"]
# HTTPS for Unix usage polling. Without it the client reports a network error, which lets
# `cargo check --no-default-features --target aarch64-apple-darwin` run where `ring` cannot be
# cross-built. Windows uses WinHTTP and ignores it.
https-client = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus","Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "render"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSDictionary", "NSValue", "NSObject", "NSArray", "NSEnumerator", "NSData", "NSDate", "NSRunLoop", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSFont", "NSColor", "NSParagraphStyle", "NSStringDrawing", "NSText", "NSAttributedString", "NSFontDescriptor", "NSGraphics", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSImageView", "NSImage", "NSControl", "NSCell", "NSScreen", "NSApplication", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSMenu", "NSMenuItem", "NSEvent", "objc2-core-graphics", "objc2-core-foundation", "libc"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
