[package]
name = "aherald"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Portable native Windows notification companion"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aherald"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
