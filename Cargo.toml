[package]
name = "aherald"
version = "0.17.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Portable native notification companion for AI coding agents (Windows, macOS, Linux)"

[workspace]
# `aherald-ping` is a separate crate so a static musl build never compiles the GUI dependencies. The
# root package stays the default member: `cargo build`, `cargo test` and the packaging scripts are
# unchanged. Its version must equal this one (tests/workspace.rs).
members = ["crates/aherald-ping"]

# One lint policy for both crates (AH-249). Unsafe code is limited to the OS bindings; these make
# every `unsafe` block say why it is sound.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aherald"
path = "src/main.rs"

[[bin]]
name = "aherald-cli"
path = "src/bin/aherald-cli.rs"

[[example]]
name = "generate_assets"
path = "examples/tools/generate_assets.rs"

[[example]]
name = "generate_app_icon"
path = "examples/tools/generate_app_icon.rs"

[[example]]
name = "session_warning_bridge"
path = "tests/live/fixtures/session_warning_bridge.rs"

[[example]]
name = "active_session_probe"
path = "tests/live/fixtures/active_session_probe.rs"

[features]
default = ["https-client"]
# HTTPS for Unix usage polling. Without it the client reports a network error, which lets
# `cargo check --no-default-features --target aarch64-apple-darwin` run where `ring` cannot be
# cross-built. Windows uses WinHTTP and ignores it.
https-client = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus","Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr", "render"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSDictionary", "NSValue", "NSObject", "NSArray", "NSEnumerator", "NSData", "NSDate", "NSRunLoop", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSFont", "NSColor", "NSParagraphStyle", "NSStringDrawing", "NSText", "NSAttributedString", "NSFontDescriptor", "NSGraphics", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSImageView", "NSImage", "NSControl", "NSCell", "NSScreen", "NSApplication", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSTextField", "NSScrollView", "NSTextView", "NSMenu", "NSMenuItem", "NSEvent", "objc2-core-graphics", "objc2-core-foundation", "libc"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo build --profile ping -p aherald-ping`: the smallest sender, for guests.
[profile.ping]
inherits = "release"
opt-level = "z"
panic = "abort"

# Test-only parameterization (AH-110); never linked into aherald.exe.
[dev-dependencies]
rstest = { version = "=0.28.0", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"
