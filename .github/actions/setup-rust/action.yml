name: Set up Rust
description: Install the pinned Rust toolchain and restore the cargo cache.

inputs:
  toolchain:
    description: >-
      Toolchain to install. The default is the single place that pins the compiler for CI
      and releases; the nightly canary passes "stable" and the MSRV job passes the
      crate's rust-version.
    default: "1.98.1"
  components:
    description: Comma-separated components to add, for example "rustfmt, clippy".
    default: ""
  targets:
    description: Comma-separated extra targets to install.
    default: ""
  cache:
    description: Restore (and, on master, save) the cargo cache.
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Only master saves the cache: a pull request restores the default branch's cache and
    # would otherwise fill the repository's cache quota with per-branch copies.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      if: inputs.cache == 'true'
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}

    # build.rs stamps the build time into the binary (`--version`, About). Without a fixed
    # SOURCE_DATE_EPOCH the stamp is the moment the build script last ran, so two builds of one
    # commit differ. The commit time makes the stamp, and with it the binary, reproducible (AH-252).
    - name: Fix the build time to the commit time
      shell: bash
      # The one write to GITHUB_ENV in this repository: the value is the commit time as an integer
      # (checked below), so it cannot carry a newline or a second variable into the file.
      run: | # zizmor: ignore[github-env]
        epoch=$(git log -1 --format=%ct)
        case "$epoch" in '' | *[!0-9]*) echo "::error::unexpected commit time" >&2; exit 1 ;; esac
        echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
