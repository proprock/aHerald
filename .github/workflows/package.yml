name: Package

# The release builds of every platform, shared by the release workflow (a pushed tag) and the
# nightly workflow (the rolling prerelease). The caller decides what is built and what happens to
# the files: the artifacts are uploaded under fixed names, and the caller publishes them.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to build, such as refs/tags/v1.2.3 or a commit SHA.
        type: string
        required: true
      tag:
        description: The name that the scripts put in the file names, "v" and the crate version.
        type: string
        required: true
      run_tests:
        description: Run the test suites on each platform before building.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify the tag matches the crate version
        shell: pwsh
        run: |
          . ./scripts/Version.ps1
          Assert-TagMatches "$env:RELEASE_TAG" (Get-CrateVersion)

      # The noisy timing checks run in the nightly full run and the memory check alone in every
      # CI run, not here (AH-251, AH-221).
      - name: Test
        if: inputs.run_tests
        shell: bash
        run: |
          skips=$(sh .github/noisy-test-args.sh)
          echo "Skipping: $skips"
          # shellcheck disable=SC2086 # the names are plain identifiers
          cargo test --locked --workspace --all-targets -- $skips

      - name: Test documentation examples
        if: inputs.run_tests
        run: cargo test --locked --workspace --doc

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Check the executable is portable
        shell: pwsh
        run: ./scripts/check-release.ps1

      - name: Assemble the portable archive and verify a clean extraction runs
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG

      - name: Install the signed Inno Setup compiler
        uses: ./.github/actions/install-inno-setup

      - name: Build the per-user Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Tag $env:RELEASE_TAG

      - name: Verify isolated installer lifecycle
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Tag $env:RELEASE_TAG -InstallerAppId aHerald.Native.InstallerTest
          ./tests/installer_windows.ps1 -Installer "dist/aherald-$env:RELEASE_TAG-windows-x64-setup-test.exe"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*-setup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  # Apple Silicon only; the archive and the disk image are ad-hoc signed and not notarized. The runner cannot show
  # the card, so the macOS visual check stays a manual step (see RELEASE.md).
  package_macos:
    name: Package macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin

      - name: Verify the tag matches the crate version
        run: |
          . ./scripts/version.sh
          require_tag_matches "$RELEASE_TAG" "$(crate_version)"

      # The noisy timing checks run in the nightly full run and the memory check alone in every
      # CI run, not here (AH-251, AH-221).
      - name: Test
        if: inputs.run_tests
        shell: bash
        run: |
          skips=$(sh .github/noisy-test-args.sh)
          echo "Skipping: $skips"
          # shellcheck disable=SC2086 # the names are plain identifiers
          cargo test --locked --workspace --all-targets -- $skips

      - name: Test documentation examples
        if: inputs.run_tests
        run: cargo test --locked --workspace --doc

      - name: Build release executable
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Assemble the app archive and verify a clean extraction runs
        run: ./scripts/package-macos.sh target/aarch64-apple-darwin/release/aherald "$RELEASE_TAG"

      - name: Build the disk image and verify its layout, signature and isolated lifecycle
        run: ./scripts/package-dmg.sh "$RELEASE_TAG"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  package_linux:
    name: Package Linux x86-64 GNU
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libglib2.0-0 libpulse0

      - name: Test
        if: inputs.run_tests
        run: |
          skips=$(sh .github/noisy-test-args.sh)
          echo "Skipping: $skips"
          # shellcheck disable=SC2086 # the names are plain identifiers
          cargo test --locked --workspace --all-targets -- $skips
          cargo test --locked --workspace --doc

      - name: Build and check the console setup
        run: |
          cargo build --locked --release
          python3 tests/console_setup_linux.py target/release/aherald

      - name: Assemble and verify archive
        run: ./scripts/package-linux.sh target/release/aherald "$RELEASE_TAG"

      - name: Assemble and verify Debian package
        run: sh ./scripts/package-deb.sh target/release/aherald "$RELEASE_TAG"

      - name: Verify isolated Debian lifecycle
        run: sh ./tests/linux_deb_lifecycle.sh "dist/aherald-$RELEASE_TAG-linux-x86_64-gnu.deb"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-gnu
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  package_ping:
    name: Package aherald-ping (Linux musl)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # The tests link the aherald library, whose audio code needs libpulse at link time.
      - name: Install link-time libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      # The crate is pure Rust, so rust-lld links both targets without a C cross toolchain.
      - name: Build both static binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --locked --profile ping -p aherald-ping --target x86_64-unknown-linux-musl
          cargo build --locked --profile ping -p aherald-ping --target aarch64-unknown-linux-musl

      - name: Verify they are static and name the files
        run: |
          sh ./scripts/package-ping.sh x86_64 "$RELEASE_TAG"
          sh ./scripts/package-ping.sh aarch64 "$RELEASE_TAG"

      - name: Run the x86_64 build in a container against a host listener
        env:
          AHERALD_PING_STATIC: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/ping/aherald-ping
        run: cargo test --locked -p aherald-ping --test container -- --ignored

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aherald-ping-*-musl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aherald-ping-linux-musl
          path: |
            dist/aherald-ping-*-musl
            dist/aherald-ping-*-musl.sha256
          if-no-files-found: error
