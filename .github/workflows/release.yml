name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify the tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("$env:RELEASE_TAG" -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match Cargo.toml version $version"
          }

      - name: Test
        run: cargo test --all-targets

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Check the executable is portable
        shell: pwsh
        run: ./check-release.ps1

      - name: Assemble the portable archive and verify a clean extraction runs
        shell: pwsh
        run: ./package-release.ps1 -Tag $env:RELEASE_TAG

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # Apple Silicon only; the archive is ad-hoc signed and not notarized. The runner cannot show
  # the card, so the macOS visual check stays a manual step (see RELEASE.md).
  package_macos:
    name: Package macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2; exit 1; }

      - name: Test
        run: cargo test --all-targets

      - name: Build release executable
        run: cargo build --release --target aarch64-apple-darwin

      - name: Assemble the app archive and verify a clean extraction runs
        run: ./package-macos.sh target/aarch64-apple-darwin/release/aherald "$RELEASE_TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  package_linux:
    name: Package Linux x86-64 GNU
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libglib2.0-0 libpulse0

      - name: Test and build
        run: |
          cargo test --locked --all-targets
          cargo build --locked --release

      - name: Assemble and verify archive
        run: ./package-linux.sh target/release/aherald "$RELEASE_TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-gnu
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  draft_release:
    name: Draft GitHub Release
    needs: [package, package_macos, package_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-artifacts
          merge-multiple: true
      - name: Extract the release notes from CHANGELOG.md
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v version="$VERSION" '/^## \[/ { in_section = index($0, "## [" version "]") == 1; next } in_section' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no entry for $VERSION" >&2; exit 1; }
      - name: Create or verify the draft and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo "GitHub Release $RELEASE_TAG already exists and is not a draft." >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --verify-tag --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber

  publish:
    name: Publish GitHub Release
    needs: draft_release
    runs-on: ubuntu-latest
    # Add required reviewers to the `release` environment to approve each publication.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
