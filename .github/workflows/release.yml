name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

# Two runs for one tag would race on the draft release; the second waits for the first.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Nothing is built for a tag that is malformed, is not a tag, or is not on master. A
  # workflow_dispatch input is free text, so the shape is checked before any other job
  # uses the value.
  verify_tag:
    name: Verify the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.verify.outputs.prerelease }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag name, type and branch
        id: verify
        run: |
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "$RELEASE_TAG is not a version tag such as v1.2.3 or v1.2.3-rc.1." >&2; exit 1; }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" \
            || { echo "$RELEASE_TAG is not a tag." >&2; exit 1; }
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/master \
            || { echo "$RELEASE_TAG is not reachable from master." >&2; exit 1; }
          prerelease=false
          case "$RELEASE_TAG" in *-*) prerelease=true ;; esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: verify_tag
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      ref: refs/tags/${{ needs.verify_tag.outputs.tag }}
      tag: ${{ needs.verify_tag.outputs.tag }}

  draft_release:
    name: Draft GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # One step per artifact: a new artifact name never reaches the release by accident.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-gnu
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aherald-ping-linux-musl
          path: release-artifacts

      - name: Check that every platform delivered its files and checksums
        run: |
          for pattern in '*-setup.exe' '*.dmg' '*.deb' '*.tar.gz' '*.zip' 'aherald-ping-*-musl'; do
            compgen -G "release-artifacts/$pattern" > /dev/null || { echo "No $pattern in the release artifacts." >&2; exit 1; }
          done
          for file in release-artifacts/*; do
            case "$file" in *.sha256) continue ;; esac
            test -f "$file.sha256" || { echo "No checksum for $file." >&2; exit 1; }
          done

      - name: Extract the release notes from CHANGELOG.md
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v version="$VERSION" '/^## \[/ { in_section = index($0, "## [" version "]") == 1; next } in_section' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no entry for $VERSION" >&2; exit 1; }

      - name: Create or verify the draft and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo "GitHub Release $RELEASE_TAG already exists and is not a draft." >&2; exit 1; }
          else
            prerelease=()
            case "$RELEASE_TAG" in *-*) prerelease=(--prerelease);; esac
            gh release create "$RELEASE_TAG" --draft "${prerelease[@]}" --title "$RELEASE_TAG" --verify-tag --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber

  publish:
    name: Publish GitHub Release
    needs: draft_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Add required reviewers to the `release` environment to approve each publication.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  update_tap:
    name: Update the Homebrew cask
    needs: [verify_tag, publish]
    # Pre-releases are not offered through the cask.
    if: needs.verify_tag.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The fine-grained TAP_TOKEN reaches only the tap repository. The checkout keeps it
      # so that the push below is authenticated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: proprock/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          persist-credentials: true
      - name: Set version and checksum, then open a pull request
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Secret TAP_TOKEN is not set; update the cask by hand." >&2; exit 1; }
          ./update-cask.sh aherald "$RELEASE_TAG"
          git diff --quiet && { echo "The cask already matches $RELEASE_TAG."; exit 0; }
          branch="aherald-${RELEASE_TAG}"
          git config user.name "aHerald release"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "aherald ${RELEASE_TAG#v}"
          # The branch belongs to this job alone, so a re-run may overwrite an earlier attempt.
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$branch" --title "aherald ${RELEASE_TAG#v}" --body "Release ${RELEASE_TAG} of proprock/aHerald."
          fi
          # The release is already published and approved, so the cask pull request is merged
          # once the tap's own style check passes. The tap has no branch protection, so wait
          # until that check is reported; with no check the watch below fails and nothing merges.
          for _ in $(seq 1 24); do
            [ "$(gh pr view "$branch" --json statusCheckRollup --jq '.statusCheckRollup | length')" -gt 0 ] && break
            sleep 5
          done
          gh pr checks "$branch" --watch --fail-fast
          gh pr merge "$branch" --squash --delete-branch
