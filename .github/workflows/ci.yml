name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # paths-filter reads pull-request changes through the GitHub API; push
      # events need a shallow checkout for the commit range.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Both patterns must match each changed file; the default "some"
          # would include Markdown through the catch-all pattern.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

  quality:
    name: Build and test (${{ matrix.os }})
    needs: changes
    # Keep all three required check names for Markdown-only changes. GitHub
    # does not expand a matrix when its job-level condition skips the job.
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Skip builds for Markdown-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo 'Only Markdown changed; build and tests are not needed.'

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 xvfb xauth dbus

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.code == 'true'

      - name: cargo fmt --check
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --all-targets

      - name: Test Linux tray and warning lifecycle
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          dbus-run-session -- env AH113_ISOLATED=1
          cargo test --test linux_apply -- --ignored --test-threads=1

      - name: Verify the isolated macOS app lifecycle
        if: needs.changes.outputs.code == 'true' && runner.os == 'macOS'
        run: |
          cargo build
          ./tests/macos_app_lifecycle.sh target/debug/aherald

      - name: Verify installer failure diagnostics
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installer_diagnostics.ps1

      - name: Build and package Windows release candidate
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./check-release.ps1
          ./package-release.ps1

      - name: Install the signed Inno Setup compiler
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') {
            throw 'Invalid Inno Setup signature'
          }
          $compilerDir = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 7'
          $process = Start-Process $installer -ArgumentList @('/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $compilerDir + '"'), '/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }

      - name: Verify isolated Windows installer lifecycle
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build-installer.ps1 -InstallerAppId aHerald.Native.InstallerTest
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          ./tests/installer_windows.ps1 -Installer "dist/aherald-v$version-windows-x64-setup-test.exe"

  # Ubuntu 22.04 is pinned on purpose: the Debian package declares libc6 >= 2.35, and the
  # isolated lifecycle test needs unprivileged user namespaces, which 24.04's AppArmor
  # restricts by default. It runs beside the quality matrix and is not a required check.
  linux_package:
    name: Linux package and console setup (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libglib2.0-0 libpulse0

      - name: Build
        run: cargo build --locked

      - name: Verify interactive console setup
        run: python3 tests/console_setup_linux.py target/debug/aherald

      - name: Assemble the Debian package and verify its isolated lifecycle
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          sh ./package-deb.sh target/debug/aherald "v$version"
          sh ./tests/linux_deb_lifecycle.sh "dist/aherald-v$version-linux-x86_64-gnu.deb"
