name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.flags.outputs.code }}
      windows: ${{ steps.flags.outputs.windows }}
      linux: ${{ steps.flags.outputs.linux }}
      macos: ${{ steps.flags.outputs.macos }}
      os: ${{ steps.flags.outputs.os }}
    steps:
      # The checkout is the pull request merge commit, so diffing against the base
      # branch tip yields exactly the changes this pull request brings in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: flags
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only "$BASE_SHA" HEAD | sh .github/platform-flags.sh >> "$GITHUB_OUTPUT"

  quality:
    name: Build and test (${{ matrix.os }})
    needs: changes
    # The changes job lists only the platforms that the pull request affects. An empty list
    # skips this job, and the "CI gate" check accepts that skip.
    if: needs.changes.outputs.os != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 xvfb xauth dbus

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: Test Linux tray and warning lifecycle
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          dbus-run-session -- env AH113_ISOLATED=1
          cargo test --locked --test linux_apply -- --ignored --test-threads=1

      - name: Verify the isolated macOS app lifecycle
        if: runner.os == 'macOS'
        run: |
          cargo build --locked
          ./tests/macos_app_lifecycle.sh target/debug/aherald

      - name: Verify installer failure diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installer_diagnostics.ps1

      - name: Build and package Windows release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./check-release.ps1
          ./package-release.ps1

      # The installer is cached by version; the Authenticode check below still runs on every
      # job, so a corrupt cached file fails the job and needs a new key to recover.
      - name: Restore the Inno Setup installer cache
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/innosetup-7.1.1-x64.exe
          key: innosetup-7.1.1-x64

      - name: Install the signed Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') {
            throw 'Invalid Inno Setup signature'
          }
          $compilerDir = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 7'
          $process = Start-Process $installer -ArgumentList @('/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $compilerDir + '"'), '/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }

      - name: Verify isolated Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build-installer.ps1 -InstallerAppId aHerald.Native.InstallerTest
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          ./tests/installer_windows.ps1 -Installer "dist/aherald-v$version-windows-x64-setup-test.exe"

  # One required check for every platform leg: it passes when each leg succeeded or was skipped
  # because its platform is unaffected. It runs even when a job failed, so the check never hangs.
  ci-gate:
    name: CI gate
    needs: [changes, quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          for result in "$CHANGES" "$QUALITY"; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended with: $result"; exit 1 ;;
            esac
          done

  # Ubuntu 22.04 is pinned on purpose: the Debian package declares libc6 >= 2.35, and the
  # isolated lifecycle test needs unprivileged user namespaces, which 24.04's AppArmor
  # restricts by default. It is not a required check.
  linux_package:
    name: Linux package and console setup (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libglib2.0-0 libpulse0

      - name: Build
        run: cargo build --locked

      - name: Verify interactive console setup
        run: python3 tests/console_setup_linux.py target/debug/aherald

      - name: Assemble the Debian package and verify its isolated lifecycle
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          sh ./package-deb.sh target/debug/aherald "v$version"
          sh ./tests/linux_deb_lifecycle.sh "dist/aherald-v$version-linux-x86_64-gnu.deb"
