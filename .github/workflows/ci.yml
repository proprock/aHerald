name: CI

on:
  pull_request:
  # The nightly workflow runs everything on master: all platforms, the slow packaging and
  # installer checks and the timing budgets that a pull request leaves out. Its run also
  # saves the cargo cache that pull requests restore.
  workflow_call:
    inputs:
      full:
        description: Run every check on every platform.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older pull request run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.flags.outputs.code }}
      deps: ${{ steps.flags.outputs.deps }}
      workflows: ${{ steps.flags.outputs.workflows }}
      linux: ${{ steps.flags.outputs.linux }}
      pkg_windows: ${{ steps.flags.outputs.pkg_windows }}
      pkg_linux: ${{ steps.flags.outputs.pkg_linux }}
      pkg_macos: ${{ steps.flags.outputs.pkg_macos }}
      os: ${{ steps.flags.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the path classifier
        run: sh tests/ci_platform_flags.sh

      # The checkout is the pull request merge commit, so diffing against the base branch
      # tip yields exactly the changes this pull request brings in; a diff needs only the
      # two trees, not the history. The full run does not look at the diff at all.
      - name: Classify changed paths
        id: flags
        env:
          FULL: ${{ inputs.full }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$FULL" = true ]; then
            sh .github/platform-flags.sh --all < /dev/null >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD | sh .github/platform-flags.sh >> "$GITHUB_OUTPUT"
          fi

  # Formatting does not depend on the platform, so one runner checks it for every change.
  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # The crate must keep building on the oldest compiler that Cargo.toml promises.
  msrv:
    name: MSRV build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'aherald').rust_version
          if (-not $version) { throw 'Cargo.toml has no rust-version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check
        run: cargo check --locked --workspace

  # Known vulnerabilities in the dependency tree. A pull request runs it when the manifest or
  # the lock file changes; the nightly run catches advisories published later.
  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # Lints the workflow files themselves: syntax and expression errors (actionlint) and
  # security smells such as template injection and unpinned actions (zizmor).
  workflow_lint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor@1.32.0

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .

  quality:
    name: Build and test (${{ matrix.os }})
    needs: changes
    # The changes job lists only the platforms that the change affects. An empty list
    # skips this job, and the "CI gate" check accepts that skip.
    if: needs.changes.outputs.os != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 xvfb xauth dbus

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Timing budgets and the native memory-growth check (AH-221) are noisy on a shared
      # runner, so a pull request skips them; the nightly run keeps them. A renamed test only
      # runs early again, never drops out of the nightly run.
      - name: cargo test
        if: ${{ !inputs.full }}
        run: >-
          cargo test --locked --workspace --all-targets --
          --skip warmed_artwork_preparation_stays_inside_budget
          --skip hot_paths_stay_inside_their_baseline_budgets
          --skip the_wrapper_costs_little_beyond_starting_the_executable
          --skip repeated_card_rendering_and_dpi_resize_release_native_resources

      - name: cargo test (including the noisy checks)
        if: ${{ inputs.full }}
        run: cargo test --locked --workspace --all-targets

      # --all-targets leaves out documentation tests.
      - name: cargo test --doc
        run: cargo test --locked --workspace --doc

      # The resident opens an X display first, so these tests skip on a runner without one.
      - name: Test the remote listener with a real resident
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          cargo test --locked --test remote_listener

      - name: Test Linux tray and warning lifecycle
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s '-screen 0 1280x1024x24'
          dbus-run-session -- env AH113_ISOLATED=1
          cargo test --locked --test linux_apply -- --ignored --test-threads=1

      # The package and installer checks below run when the change can affect a package (see
      # packaging_for in .github/platform-flags.sh) and in every nightly run.
      - name: Verify the isolated macOS app lifecycle
        if: runner.os == 'macOS' && needs.changes.outputs.pkg_macos == 'true'
        run: |
          cargo build --locked
          ./tests/macos_app_lifecycle.sh target/debug/aherald

      - name: Verify installer failure diagnostics
        if: runner.os == 'Windows' && needs.changes.outputs.pkg_windows == 'true'
        shell: pwsh
        run: ./tests/installer_diagnostics.ps1

      # The release build and the portability check run on every change: they catch a
      # release-profile break that the debug build above cannot see.
      - name: Build the Windows release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./check-release.ps1

      - name: Package the Windows release candidate
        if: runner.os == 'Windows' && needs.changes.outputs.pkg_windows == 'true'
        shell: pwsh
        run: ./package-release.ps1

      - name: Install the signed Inno Setup compiler
        if: runner.os == 'Windows' && needs.changes.outputs.pkg_windows == 'true'
        uses: ./.github/actions/install-inno-setup

      - name: Verify isolated Windows installer lifecycle
        if: runner.os == 'Windows' && needs.changes.outputs.pkg_windows == 'true'
        shell: pwsh
        run: |
          ./build-installer.ps1 -InstallerAppId aHerald.Native.InstallerTest
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'aherald').version
          ./tests/installer_windows.ps1 -Installer "dist/aherald-v$version-windows-x64-setup-test.exe"

  # Ubuntu 22.04 is pinned on purpose: the Debian package declares libc6 >= 2.35, and the
  # isolated lifecycle test needs unprivileged user namespaces, which 24.04's AppArmor
  # restricts by default. The quality job's Linux leg runs on the same image. It runs when the
  # change can affect the package and in every nightly run.
  linux_package:
    name: Linux package and console setup (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.linux == 'true' && needs.changes.outputs.pkg_linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libglib2.0-0 libpulse0

      - name: Build
        run: cargo build --locked

      - name: Verify interactive console setup
        run: python3 tests/console_setup_linux.py target/debug/aherald

      - name: Assemble the Debian package and verify its isolated lifecycle
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          sh ./package-deb.sh target/debug/aherald "v$version"
          sh ./tests/linux_deb_lifecycle.sh "dist/aherald-v$version-linux-x86_64-gnu.deb"

  # The static sender in a real container (AH-228). An optional feature that needs the Docker
  # bridge of the runner, so only the nightly run (full) executes it, and it is not in the gate.
  ping_container:
    name: aherald-ping in a container (ubuntu-22.04)
    needs: changes
    if: inputs.full && needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # The tests link the aherald library, whose audio code needs libpulse at link time.
      - name: Install link-time libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      # The same build and packaging steps as `package_ping` in release.yml, so a release does
      # not meet them for the first time.
      - name: Build both static senders
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --locked --profile ping -p aherald-ping --target x86_64-unknown-linux-musl
          cargo build --locked --profile ping -p aherald-ping --target aarch64-unknown-linux-musl

      - name: Package them and run the x86_64 one in a container
        env:
          AHERALD_PING_STATIC: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/ping/aherald-ping
        run: |
          sh ./package-ping.sh x86_64
          sh ./package-ping.sh aarch64
          cargo test --locked -p aherald-ping --test container -- --ignored

  # One required check for every job: it passes when each one succeeded or was skipped
  # because it does not apply to the change. It runs even when a job failed, so the check
  # never hangs.
  ci-gate:
    name: CI gate
    needs: [changes, fmt, msrv, audit, workflow_lint, quality, linux_package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended with: $result"; exit 1 ;;
            esac
          done
