name: Nightly retry

# Reruns a failed Nightly attempt when its failed jobs never got a runner (a macOS job waited for a
# runner until its time limit and was cancelled), and only then: a real failure stays red. At most
# two reruns. The decision is made by scripts/nightly-retry-decision.sh (AH-296). A workflow_run
# workflow starts only from the default branch, so a change here takes effect after it is merged.
#
# workflow_run is flagged by zizmor because such workflows often check out the code of the run that
# triggered them. This one never does: it checks out the default branch, reads only the numeric run
# id and attempt, and holds no secret beyond the job's own GITHUB_TOKEN.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Nightly]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    name: Rerun when no runner was available
    # Only the scheduled or manually started Nightly on master; never a branch trial or a pull request.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_branch == 'master'
      && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      # The default branch, never the commit of the run that failed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/nightly-retry-decision.sh
          sparse-checkout-cone-mode: false
      - name: Decide and rerun
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq '.jobs[]' \
            | jq -s '{jobs: .}' > jobs.json
          decision=$(sh scripts/nightly-retry-decision.sh jobs.json "$RUN_ATTEMPT")
          echo "$decision"
          echo "Attempt $RUN_ATTEMPT of run $RUN_ID: $decision" >> "$GITHUB_STEP_SUMMARY"
          case "$decision" in
            rerun:*) gh run rerun "$RUN_ID" --failed ;;
          esac
