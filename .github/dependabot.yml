version: 2

updates:
  # Actions are pinned by commit SHA, so Dependabot is what keeps them current. The
  # composite actions under .github/actions pin their own steps.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # A release must be a week old before Dependabot proposes it, which leaves time for a
    # compromised or yanked version to be noticed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
